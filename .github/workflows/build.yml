name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Jar name
        id: jar
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR" .jar)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.jar.outputs.name }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

      - name: Publish versioned release (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          TAG="v$VERSION"
          awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
          printf '\nPut the jar in the mods folder of the client and the server (remove the previous version).\n' >> notes.md
          gh release delete latest --yes --cleanup-tag || true
          # A published release is never overwritten: bump mod_version to publish a new one.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: kept as is (bump mod_version to publish a new release)."
          else
            gh release create "$TAG" "${{ steps.jar.outputs.path }}" \
              --target "$GITHUB_SHA" --latest \
              --title "Infinity Stones: Tensura Edition $VERSION" \
              --notes-file notes.md
          fi
