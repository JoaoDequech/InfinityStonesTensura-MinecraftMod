modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = '''
The six Infinity Stones, each with its own power tree, a radial power wheel (H) and the Infinity Gauntlet.
Passives start off and every player picks what to turn on. Works in multiplayer and survival.
Pugmeowlas Infinity Stones Core, rebuilt as a standalone NeoForge mod on the Tensura Reincarnated skill engine.
Original concept inspired by Lucraft Core.
'''

